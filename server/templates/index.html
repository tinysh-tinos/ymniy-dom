<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Умный Дом</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #020024;
      background: linear-gradient(135deg, rgba(2,0,36,1) 0%, rgba(9,9,121,1) 100%);
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      display: flex;
      flex-direction: column;   
      justify-content: center;  
      align-items: center;      
      gap: 15px;
      background: rgba(255, 255, 255, 0.1); 
      backdrop-filter: blur(16px);          
      -webkit-backdrop-filter: blur(16px);  
      border: 1px solid rgba(255, 255, 255, 0.2); 
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); 
      border-radius: 20px;
      width: 280px;
      padding: 30px 20px;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
    }

    .temp_kit, .temp_mr, .vlazh_br {
      font-size: 1.2rem;
      letter-spacing: 0.5px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="temp_kit">
      Кухня: <span id="temp_kit">26 ℃</span>
    </div>
    <div class="temp_mr">
      Спальня: <span id="temp_mr">24 ℃</span>
    </div>
    <div class="vlazh_br">
      Ванная: <span id="vlazh_br">Влажно</span>
    </div>
  </div>
</body>
</html>
